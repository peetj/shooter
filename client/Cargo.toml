[package]
name = "shooter-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
shooter-shared = { path = "../shared" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "KeyboardEvent",
  "MouseEvent",
  "WebSocket",
  "MessageEvent",
  "BinaryType",
  "Event",
  "console",
] }
js-sys = "0.3"
serde.workspace = true
postcard.workspace = true
console_error_panic_hook = "0.1"
